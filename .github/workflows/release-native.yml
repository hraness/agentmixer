name: Release Native xcb

on:
  workflow_run:
    workflows: ["Release AgentMixer"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  build:
    name: Build native binary (${{ matrix.os }})
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Build release binary
        run: cargo build --release --locked -p xcb-cli
      - name: Package binary
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m)
          case "$arch" in
            x86_64) arch="x86_64" ;;
            arm64|aarch64) arch="aarch64" ;;
            *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          name="xcb-${version}-${os}-${arch}"
          work=$(mktemp -d)
          install -m 0755 target/release/xcb "$work/xcb"
          tar -czf "${name}.tar.gz" -C "$work" xcb
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "tarball=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${name}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload --clobber "${GITHUB_REF_NAME}" "${{ steps.package.outputs.tarball }}" "${{ steps.package.outputs.checksum }}"
