name: Release Native xcb

on:
  workflow_run:
    workflows: ["Release XCB"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  build:
    name: Build native binary (${{ matrix.os }})
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Build and package native binary
        id: package
        env:
          XCB_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ./scripts/build-native.sh
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload --clobber "${{ github.ref_name }}" artifacts/xcb-*.tar.gz artifacts/xcb-*.tar.gz.sha256
